  <path d="M259 204 C201 198 158 163 144 92 C215 94 263 129 259 204Z" fill="url(#leafLeft)"/>
  <path d="M263 210 C279 146 328 113 403 109 C394 184 349 215 263 210Z" fill="url(#leafRight)"/>
  <path d="M170 119 C211 141 241 170 256 196" fill="none" stroke="#b5ff8c" stroke-width="7" opacity=".5" stroke-linecap="round"/>
  <path d="M287 197 C321 163 347 146 383 131" fill="none" stroke="#dcffa6" stroke-width="6" opacity=".34" stroke-linecap="round"/>
  <circle cx="153" cy="332" r="19" fill="#d0ffa4" opacity=".14"/>
