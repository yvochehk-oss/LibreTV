<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">豌豆芽</title>
  <desc id="desc">一颗绿色豌豆生长出两片新叶</desc>
  <defs>
    <radialGradient id="background" cx="45%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#112e23"/>
      <stop offset="100%" stop-color="#071810"/>
    </radialGradient>
    <linearGradient id="leafLeft" x1="0" y1="0" x2=".95" y2="1">
      <stop offset="0%" stop-color="#93ff70"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="leafRight" x1="0" y1="0" x2=".92" y2="1">
      <stop offset="0%" stop-color="#a6ff7e"/>
      <stop offset="100%" stop-color="#34d765"/>
    </linearGradient>
    <radialGradient id="pea" cx="36%" cy="22%" r="87%">
      <stop offset="0%" stop-color="#b2ff7a"/>
      <stop offset="52%" stop-color="#4de35e"/>
      <stop offset="100%" stop-color="#149b48"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2e6b49" stroke-opacity=".35" stroke-width="4"/>
  <!-- The seed is an unmistakable round pea even at 16px favicon sizes. -->
  <circle cx="179" cy="353" r="71" fill="url(#pea)"/>
  <path d="M186 353 C256 340 274 292 271 226 C270 208 270 192 265 178"
